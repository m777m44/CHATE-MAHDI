name: Android Release

# Builds a release-signed APK on every push to main, on version tags (v*),
# and manually. The APK is published to GitHub Releases as app-release.apk so
# the in-app updater can fetch:
#   https://api.github.com/repos/m777m44/CHATE-MAHDI/releases/latest
# and offer "تحديث" directly from inside the app.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Stable identity: applicationId is fixed in mobile/android/app/build.gradle,
      # and the SAME keystore signs every release (required to update-over-install).
      CM_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/app/key.jks
      CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Java 17 (required by AGP 8.x)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) Flutter (pinned version for reproducible builds)
      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      # 4) Dependencies
      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      # 5) Decode the signing keystore from repository secrets
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Repository secrets are missing. Set the 4 secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) as shown in README > 'التوقيع والـ Secrets', then re-run this workflow."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CM_KEYSTORE_PATH"
          test -s "$CM_KEYSTORE_PATH"

      # 6) Release-signed APK (versionCode increases with every run_number)
      - name: Build release APK
        working-directory: mobile
        run: |
          BUILD_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)"
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}"

      # 7+8) Create/update the GitHub Release and upload the asset
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(grep '^version:' mobile/pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)"
          BUILD_NUMBER="${{ github.run_number }}"

          # Tag pushes release under the tag; plain pushes release under the
          # version from pubspec.yaml (latest release always points there).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          cp mobile/build/app/outputs/flutter-apk/app-release.apk /tmp/app-release.apk

          NOTES_FILE="$(mktemp)"
          {
            printf '## CHATE-MAHDI %s\n\n' "${TAG}"
            printf "الإصدار: ${VERSION}\n"
            printf "versionCode: ${BUILD_NUMBER}\n"
            printf 'التطبيق يدعم التحديث الداخلي (In-App Update): سيتحقق تلقائياً من هذا الإصدار ويعرض زر تحديث.\n'
          } > "$NOTES_FILE"

          if gh release view "$TAG" --repo m777m44/CHATE-MAHDI >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/app-release.apk --repo m777m44/CHATE-MAHDI --clobber
            gh release edit "$TAG" --repo m777m44/CHATE-MAHDI --latest --title "CHATE-MAHDI ${TAG}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" /tmp/app-release.apk \
              --repo m777m44/CHATE-MAHDI \
              --latest \
              --title "CHATE-MAHDI ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi
          rm -f "$NOTES_FILE"

      # 9) Print version + versionCode in the log
      - name: Report version
        run: |
          VERSION="$(grep '^version:' mobile/pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)"
          echo "VERSION_NAME = ${VERSION}"
          echo "VERSION_CODE = ${{ github.run_number }}"
          echo "APK          = mobile/build/app/outputs/flutter-apk/app-release.apk (${GITHUB_REF_NAME})"

      # 10) Verify the permanent direct-download link responds
      - name: Verify latest APK link
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L \
              "https://github.com/m777m44/CHATE-MAHDI/releases/latest/download/app-release.apk")
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Latest APK download link verified."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Latest APK link not verified yet (GitHub cache may lag)."
