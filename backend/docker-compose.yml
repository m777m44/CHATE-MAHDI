services:
  db:
    image: postgres:16-alpine
    container_name: chatemahdi-db
    environment:
      POSTGRES_USER: chatemahdi
      POSTGRES_PASSWORD: chatemahdi
      POSTGRES_DB: chatemahdi
    ports:
      - "5432:5432"
    volumes:
      - chatemahdi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatemahdi"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  chatemahdi_pgdata:
