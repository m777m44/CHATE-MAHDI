name: chatemahdi
description: CHATE-MAHDI - Instagram-style social app with in-app updates.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1
  timeago: ^3.7.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
